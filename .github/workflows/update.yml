name: Update

on:
  schedule:
    # Weekly link & repo health check
    - cron: '0 6 * * 1'   # Mondays at 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'README.md'

jobs:
  link-check:
    name: Verify all linked repos still exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract GitHub repo links
        id: extract
        run: |
          # Pull every github.com/<owner>/<repo> link from README.md
          grep -oE 'https://github\.com/[A-Za-z0-9._/-]+' README.md \
            | grep -oE 'github\.com/[^/]+/[^/)#?]+' \
            | sort -u \
            > links.txt
          echo "Found $(wc -l < links.txt) unique repo links."
          cat links.txt

      - name: Probe each link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          fail=0
          while read -r link; do
            slug="${link#github.com/}"
            owner="${slug%%/*}"
            repo="${slug#*/}"
            status=$(gh api "repos/$owner/$repo" --jq '.full_name' 2>/dev/null)
            if [ -z "$status" ]; then
              echo "::warning ::Dead link: $link"
              fail=$((fail + 1))
            else
              echo "OK: $link"
            fi
          done < links.txt
          if [ "$fail" -gt 0 ]; then
            echo "::warning ::$fail dead link(s) detected. Review and update README.md."
          fi
          # Don't fail CI on dead links — open an issue instead in v0.2
          exit 0
